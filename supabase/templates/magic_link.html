<!-- Paste into Supabase: Authentication > Emails > Magic Link. Subject: "Your Cat Nap Fund sign-in" -->
<div style="margin:0;padding:24px 12px;background:#eff1f5;font-family:'Nunito',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;">
    <tr>
      <td style="background:#e6e9ef;border:1px solid #ccd0da;border-radius:16px;padding:28px 24px;text-align:center;color:#4c4f69;">
        <img src="{{ .SiteURL }}/cat.png" width="180" alt="A sleepy cat curled up for a nap"
             style="display:block;margin:0 auto 12px;max-width:180px;height:auto;border:0;" />
        <h1 style="margin:0 0 8px;font-size:22px;line-height:1.3;color:#4c4f69;">Cat Nap Fund &#128062;</h1>
        <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#5c5f77;">
          Shh, the cat is sleeping. Tap the button to sign in.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background:#8839ef;color:#eff1f5;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px;">
          Sign in
        </a>
        <p style="margin:28px 0 8px;font-size:14px;color:#5c5f77;">
          Using the app on your home screen? Type this code in the app instead:
        </p>
        <p style="margin:0;display:inline-block;background:#eff1f5;border:1px solid #ccd0da;border-radius:12px;padding:12px 20px;font-size:28px;font-weight:700;letter-spacing:6px;color:#4c4f69;">
          {{ .Token }}
        </p>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#5c5f77;">
          The link and code work for about an hour. If you didn't ask for this, you can ignore this email. &#128062;
        </p>
      </td>
    </tr>
  </table>
</div>
